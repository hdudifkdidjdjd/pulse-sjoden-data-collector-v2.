
name: Extract Historical Trav Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF reader
        run: python -m pip install 'pypdf>=5,<7'

      - name: Validate stable sources
        run: python -m collector validate

      - name: Extract annual statistics 2019
        run: |
          python extract_historical_pages.py \
            --kind annual_statistics \
            --year 2019 \
            --pages 15

      - name: Upload historical data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-data-2019
          path: historical_output/
          if-no-files-found: error
